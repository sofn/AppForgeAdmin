name: Lint Code
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchForgeAdmin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: ArchForgeAdmin

      # gen:api resolves ../ArchForge/spec/openapi.yaml from the repo root —
      # keep the two repos side by side.
      - name: Checkout ArchForge (contract source)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/ArchForge
          path: ArchForge

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ArchForgeAdmin/pnpm-lock.yaml

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: SDK sync check (generated types must match the contract)
        run: |
          pnpm gen:api
          git diff --exit-code src/types/schema.d.ts \
            || (echo "::error::schema.d.ts is out of sync with ArchForge/spec/openapi.yaml — run pnpm gen:api and commit" && exit 1)
          (cd ../ArchForge/scripts && npm ci --silent)
          node ../ArchForge/scripts/gen-enums.mjs
          git diff --exit-code src/types/enums.generated.ts \
            || (echo "::error::enums.generated.ts is out of sync with ArchForge/spec/enums.yaml" && exit 1)

      - name: Test
        run: pnpm test

      - name: Start Lint Code
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm typecheck
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
